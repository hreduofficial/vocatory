<title>보카토리 스터디</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one narrow study column (max 640px), sticky teal header, workbook-style tables and tiles */
:root{
  --bg:#f3f6f5; --paper:#ffffff; --ink:#17302c; --muted:#5d716d; --line:#d5e0dd;
  --teal:#0e6d62; --teal-ink:#ffffff; --teal-soft:#e2f0ed;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --bad:#c2412d; --bad-soft:#fbe9e5; --gold:#c98a12;
  --f-display:"Arial Black","Arial Bold",Arial,"Malgun Gothic",sans-serif;
  --f-body:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a18; --paper:#17252a; --ink:#e4efec; --muted:#9db3ae; --line:#2b3d3a;
  --teal:#3fb8a6; --teal-ink:#06211d; --teal-soft:#1b3632;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f07c66; --bad-soft:#3a1f1a; --gold:#e6b24a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a18; --paper:#17252a; --ink:#e4efec; --muted:#9db3ae; --line:#2b3d3a;
  --teal:#3fb8a6; --teal-ink:#06211d; --teal-soft:#1b3632;
  --ok:#5cc98a; --ok-soft:#173326; --bad:#f07c66; --bad-soft:#3a1f1a; --gold:#e6b24a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal);color:var(--teal-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.hwrap{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--f-display);font-size:20px;letter-spacing:.04em;cursor:pointer;background:none;border:0;color:inherit;padding:0}
.crumb{font-size:13px;opacity:.85;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:4px 9px;font:inherit;font-size:13px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-display);color:var(--teal);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:17px}
.eyebrow{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;cursor:pointer}
.btn{background:var(--teal);color:var(--teal-ink);border:0;border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.small{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
input:focus,select:focus{border-color:var(--teal);outline:none}
.vols{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.vol{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.vol b{font-family:var(--f-display);color:var(--teal);font-size:15px;letter-spacing:.03em}
.vol .num{font-family:var(--f-display);font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--teal-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center;color:var(--ink);display:flex;flex-direction:column;gap:2px;align-items:center}
.day .dn{font-family:var(--f-display);font-size:14px;color:var(--teal)}
.day .ds{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.pass{border-color:var(--ok);background:var(--ok-soft)}
.day.pass .ds{color:var(--ok);font-weight:700}
.day.tried .ds{color:var(--bad);font-weight:700}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:9px 12px;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--teal);color:var(--teal-ink);font-size:12px;letter-spacing:.06em;padding:7px 8px;text-align:left;white-space:nowrap}
td{border-top:1px solid var(--line);padding:7px 8px;vertical-align:top}
td.no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
td.w{font-weight:700;white-space:nowrap}
td.cls{color:var(--muted);font-size:12px;white-space:nowrap}
.def{color:var(--muted);font-size:13px;margin-top:3px}
.hidecol{color:transparent!important;background:var(--teal-soft);border-radius:4px;cursor:pointer;user-select:none}
.hidecol *{visibility:hidden}
.spk{background:none;border:0;color:var(--teal);padding:0 4px;font-size:15px;vertical-align:middle}
.card{background:var(--paper);border:2px solid var(--teal);border-radius:14px;min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center;cursor:pointer;user-select:none}
.card .big{font-family:var(--f-display);font-size:30px;color:var(--teal);word-break:break-word}
.card .mean{font-size:19px;font-weight:700;white-space:pre-line}
.card .def{color:var(--muted)}
.sent{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.sent:first-child{border-top:0}
.sent .n{font-family:var(--f-display);color:var(--teal);font-size:12px;padding-top:3px;min-width:18px}
.sent p{margin:0;flex:1;min-width:0;font-size:16px}
mark{background:var(--teal-soft);color:var(--teal);font-weight:700;border-radius:3px;padding:0 2px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qtype{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);border-radius:20px;padding:3px 10px}
.prompt{font-size:20px;font-weight:700;white-space:pre-line;word-break:break-word}
.prompt.en{font-family:var(--f-display);font-size:28px;color:var(--teal);font-weight:400}
.prompt.sent{font-size:18px;font-weight:400;display:block;border:0;padding:0}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--teal);color:var(--teal);font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--ink);white-space:pre-line}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:8px;padding:10px 12px;font-weight:700}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.prog{height:8px;border-radius:4px;background:var(--teal-soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .2s}
.score{font-family:var(--f-display);font-size:46px;color:var(--teal);line-height:1;font-variant-numeric:tabular-nums}
.stamp{font-family:var(--f-display);font-size:16px;letter-spacing:.1em;border:3px solid currentColor;border-radius:8px;padding:4px 12px;transform:rotate(-4deg);display:inline-block}
.stamp.ok{color:var(--ok)} .stamp.no{color:var(--bad)}
.cert{border:2px dashed var(--teal);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.cert dt{color:var(--muted)} .cert dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.code{font-family:"Courier New",monospace;font-size:20px;letter-spacing:.18em;color:var(--teal)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.li:first-child{border-top:0}
.li .w{font-weight:700;min-width:0;flex:0 1 40%;word-break:break-word}
.li .m{flex:1;min-width:0;color:var(--muted);font-size:13px;white-space:pre-line}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.no{background:var(--bad-soft);color:var(--bad)}
.formula{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px}
.formula div{background:var(--teal-soft);border-radius:6px;padding:6px 2px;color:var(--teal);font-weight:700}
.formula small{display:block;color:var(--muted);font-weight:400}
footer{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 30px;display:flex;gap:14px;justify-content:center}
footer button{background:none;border:0;color:var(--muted);font-size:12px;text-decoration:underline}
@media (min-width:520px){.vols{grid-template-columns:repeat(3,1fr)}.days{grid-template-columns:repeat(8,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.player{display:flex;gap:14px;align-items:center}
.lvl{flex:0 0 auto;width:64px;height:64px;border-radius:50%;background:var(--teal);color:var(--teal-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--teal-soft)}
.lvn{font-family:var(--f-display);font-size:24px;line-height:1}
.lvt{font-size:9px;letter-spacing:.16em;font-weight:700}
.pinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tier{font-family:var(--f-display);color:var(--teal);letter-spacing:.06em}
.xpn{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.xpbar{height:10px;border-radius:5px;background:var(--teal-soft);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .6s}
.flame{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.flame::before{content:"";display:inline-block;width:9px;height:12px;margin-right:4px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--line);vertical-align:-1px}
.flame.lit{color:var(--bad)} .flame.lit::before{background:var(--bad)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.badges{grid-template-columns:repeat(4,1fr)}}
.badge{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.5}
.badge.on{opacity:1;border:1.5px solid var(--gold)}
.medal{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:13px;background:var(--line);color:var(--muted)}
.badge.on .medal{background:var(--gold);color:var(--paper);box-shadow:0 0 0 3px var(--teal-soft)}
.badge b{font-size:13px} .badge small{font-size:11px;color:var(--muted);line-height:1.35}
.combo{font-family:var(--f-display);font-size:13px;color:var(--gold);letter-spacing:.04em}
.combo.hot{color:var(--bad)}
#fb{position:relative}
.xpfloat{position:absolute;right:8px;top:6px;font-family:var(--f-display);color:var(--gold);font-size:16px;animation:xpup .9s ease-out forwards;pointer-events:none}
@keyframes xpup{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.gain{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;width:100%;max-width:320px}
.gain span:nth-child(even){text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.gain .tot{border-top:1px solid var(--line);padding-top:4px;color:var(--gold);font-family:var(--f-display)}
.lvup{background:var(--teal);color:var(--teal-ink);border-radius:10px;padding:12px;text-align:center;font-weight:700;animation:pop .5s ease-out}
.lvup b{font-family:var(--f-display);font-size:20px;display:block;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.newb{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.newb .badge{opacity:1;border:1.5px solid var(--gold);width:120px;animation:pop .5s ease-out}
.rk .rkn{font-family:var(--f-display);color:var(--muted);min-width:26px;text-align:center}
.rk.top1 .rkn{color:var(--gold);font-size:18px} .rk.top2 .rkn,.rk.top3 .rkn{color:var(--teal)}
.rk.me{background:var(--teal-soft);border-radius:8px;padding-inline:6px}
.rk .w{flex:1}
@media (prefers-reduced-motion:reduce){.xpfloat,.lvup,.newb .badge{animation:none}}
</style>

<header><div class="hwrap">
  <button class="logo" id="logo" type="button">VOCATORY</button>
  <span class="crumb" id="crumb"></span>
  <button class="hbtn" id="btnWrong" type="button">오답노트</button>
</div></header>
<main id="app"><div class="panel"><p class="muted">단어 데이터를 불러오는 중이에요…</p></div></main>
<footer>
  <button type="button" id="lnkHist">내 시험 기록</button>
  <button type="button" id="lnkTeacher">선생님</button>
</footer>

<script>
(function(){
"use strict";
var DATA=null, S={view:'home'}, app=document.getElementById('app');
var SALT='HSJ-VOCATORY-2026';
var PASS={day:90,review:85,range:85,wrong:0,retry:90};
var MODE_NAME={day:'DAY 시험',review:'누적 복습 시험',range:'범위 시험',wrong:'오답노트 시험',retry:'틀린 문제 재시험'};
var TYPE_NAME={m:'영어 → 뜻',s:'뜻 → 영어 쓰기',d:'영영풀이 → 단어',b:'Target Sentence 빈칸'};

/* ---------- storage ---------- */
var mem={};
function load(k,def){try{var v=localStorage.getItem('voca.'+k);return v?JSON.parse(v):def}catch(e){return k in mem?mem[k]:def}}
function save(k,v){mem[k]=v;try{localStorage.setItem('voca.'+k,JSON.stringify(v))}catch(e){}}
var store={mode:load('mode','personal'),pin:load('pin','0000'),roster:load('roster',[]),users:load('users',{}),name:load('name',''),me:{prog:load('prog',{}),wrong:load('wrong',{})},hist:load('hist',[])};
function persist(){save('mode',store.mode);save('pin',store.pin);save('roster',store.roster);save('users',store.users);save('name',store.name);save('prog',store.me.prog);save('wrong',store.me.wrong);save('hist',store.hist.slice(-5000))}
var GUEST={prog:{},wrong:{}};
function U(){if(store.mode!=='academy')return store.me;if(!S.user)return GUEST;var u=store.users[S.user.key];if(!u)u=store.users[S.user.key]={prog:{},wrong:{}};return u}
var API_URL=''; /*API_URL*/
store.outbox=load('outbox',[]);
function saveOutbox(){save('outbox',store.outbox)}
function sinceStr(){var t=new Date(Date.now()-183*864e5);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function api(params){if(params.action==='results')params.since=sinceStr();var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');return fetch(API_URL+'?'+q).then(function(r){return r.json()})}
function apiPost(body){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
var flushing=false;
function flush(cb){
  if(!API_URL||flushing||!store.outbox.length){if(cb)cb(!store.outbox.length);return}
  flushing=true;var batch=store.outbox.slice(0,30);
  apiPost({action:'result',results:batch}).then(function(res){flushing=false;
    if(res&&res.ok){var done={};res.saved.forEach(function(c){done[c]=1});store.outbox=store.outbox.filter(function(r){return !done[r.code]});saveOutbox();if(store.outbox.length)return flush(cb)}
    if(cb)cb(!store.outbox.length)}).catch(function(){flushing=false;if(cb)cb(false)});
}
function loadRoster(cb){if(!API_URL){if(cb)cb();return}S.rosterLoading=true;
  api({action:'roster'}).then(function(res){S.rosterLoading=false;if(res&&res.ok){store.roster=res.roster;persist()}if(cb)cb()}).catch(function(){S.rosterLoading=false;if(cb)cb()})}
function loadMine(u){if(!API_URL)return;api({action:'mine',cls:u.cls,name:u.name}).then(function(res){if(!res||!res.ok)return;
  var P=store.users[u.key]||(store.users[u.key]={prog:{},wrong:{}});S.mine[u.key]=res.results;
  res.results.forEach(function(r){if(r.mode!=='day')return;var k=r.v+'-'+r.d,pr=P.prog[k]||{best:0,pass:false,tries:0};pr.best=Math.max(pr.best,r.pct);if(r.pass)pr.pass=true;P.prog[k]=pr});
  persist();if(S.user&&S.user.key===u.key&&(S.view==='home'||S.view==='vol'))render()}).catch(function(){})}
function who(){return store.mode==='academy'&&S.user?S.user:{name:store.name||'(이름 없음)',cls:''}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return (n<10?'0':'')+n}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function vol(v){return DATA[v-1]}
function dayObj(v,d){return vol(v).days[d-1]}
function W(v,d,i){var w=dayObj(v,d).w[i];return{v:v,d:d,i:i,key:v+'-'+d+'-'+i,word:w[0],cls:w[1],mean:w[2],def:w[3]}}
function dayWords(v,d){return dayObj(v,d).w.map(function(_,i){return W(v,d,i)})}
function norm(s){return String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[~.,!?;:"()\[\]]/g,' ').replace(/\s+/g,' ').trim()}
function stamp(t){return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes())}
function hashCode(str){var h=2166136261>>>0,h2=5381;for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h^=c;h=Math.imul(h,16777619)>>>0;h2=(Math.imul(h2,33)+c)>>>0}
  var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',out='',x=(h^(h2<<7))>>>0,y=h2;for(var k=0;k<6;k++){var src=k<3?x:y;out+=A[src%32];if(k<3)x=Math.floor(x/32);else y=Math.floor(y/32)}return out}
function certCode(r){return hashCode([r.name.trim(),r.v,r.d,r.mode,r.score,r.total,r.when,SALT].join('|'))}
function shortMean(m){return m.replace(/\(\([^)]*\)\)/g,'').replace(/\s+/g,' ').trim()}
var synthOK='speechSynthesis' in window;
function speak(t){if(!synthOK)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/~/g,'').replace(/\bone's\b/g,"one's"));u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function spkBtn(t){return synthOK?'<button class="spk" type="button" data-say="'+esc(t)+'" aria-label="발음 듣기">🔊</button>':''}

/* ---------- finding a word inside a Target Sentence ---------- */
var BE='(?:be|am|is|are|was|were|been|being)';
function formsRe(t){
  if(t==='be')return BE;
  if(/^(one's|someone's|someone|something|one|sb|sth|a|the)$/.test(t)&&t!=='a'&&t!=='the')return "[a-z']+";
  var w=t.replace(/[^a-z'-]/g,'');if(!w)return null;
  var f=[w,w+'s',w+'es',w+'ed',w+'d',w+'ing',w+'er',w+'est',w+'ly'];
  if(/e$/.test(w))f.push(w.slice(0,-1)+'ing');
  if(/y$/.test(w)){var r=w.slice(0,-1);f.push(r+'ies',r+'ied',r+'ier',r+'iest',r+'ily')}
  if(/[^aeiou][aeiou][bdgklmnprt]$/.test(w)){var l=w.slice(-1);f.push(w+l+'ed',w+l+'ing',w+l+'er',w+l+'est')}
  f.sort(function(a,b){return b.length-a.length});
  return '(?:'+f.map(function(x){return x.replace(/[-']/g,'\\$&')}).join('|')+')';
}
var findCache={};
function findInSent(v,d,word){
  var k=v+'|'+d+'|'+word;if(k in findCache)return findCache[k];
  var toks=word.toLowerCase().replace(/[~()]/g,' ').replace(/\//g,' ').split(/\s+/).filter(Boolean),parts=[];
  for(var i=0;i<toks.length;i++){var p=formsRe(toks[i]);if(p)parts.push(p)}
  var res=null;
  if(parts.length){
    var re=new RegExp("(^|[^A-Za-z'])("+parts.join("[\\s,]+")+")(?![A-Za-z])","i");
    var ss=dayObj(v,d).s;
    for(var j=0;j<ss.length;j++){var m=re.exec(ss[j]);if(m){var st=m.index+m[1].length;res={s:ss[j],start:st,end:st+m[2].length,ans:m[2]};break}}
  }
  findCache[k]=res;return res;
}
function highlightSent(v,d,s){
  var ranges=[];dayObj(v,d).w.forEach(function(w){var f=findInSent(v,d,w[0]);if(f&&f.s===s)ranges.push([f.start,f.end])});
  ranges.sort(function(a,b){return a[0]-b[0]});var out='',pos=0;
  ranges.forEach(function(r){if(r[0]<pos)return;out+=esc(s.slice(pos,r[0]))+'<mark>'+esc(s.slice(r[0],r[1]))+'</mark>';pos=r[1]});
  return out+esc(s.slice(pos));
}

/* ---------- building tests ---------- */
function pickMeanOpts(it){
  var pool=[],seen={};seen[shortMean(it.mean)]=1;
  var same=dayWords(it.v,it.d).filter(function(x){return x.i!==it.i});
  var vv=vol(it.v),near=[];
  for(var k=0;k<6;k++){var dd=Math.max(1,Math.min(32,it.d+(k<3?-k-1:k-2)));if(dd!==it.d)near=near.concat(dayWords(it.v,dd))}
  [shuffle(same),shuffle(near)].forEach(function(arr){arr.forEach(function(x){var m=shortMean(x.mean);if(pool.length<3&&!seen[m]&&x.word!==it.word){seen[m]=1;pool.push(m)}})});
  return shuffle(pool.concat([shortMean(it.mean)]));
}
function pickWordOpts(it){
  var pool=[],seen={};seen[it.word.toLowerCase()]=1;
  var cand=shuffle(dayWords(it.v,it.d)).concat(shuffle(dayWords(it.v,it.d<32?it.d+1:it.d-1)));
  cand.forEach(function(x){var k=x.word.toLowerCase();if(pool.length<3&&!seen[k]){seen[k]=1;pool.push(x.word)}});
  return shuffle(pool.concat([it.word]));
}
function makeQ(it,type){
  var q={it:it,type:type};
  if(type==='b'){var f=findInSent(it.v,it.d,it.word);if(!f){type='d';q.type='d'}else{q.sent=f;q.answer=f.ans}}
  if(type==='m'){q.opts=pickMeanOpts(it);q.answer=shortMean(it.mean)}
  if(type==='d'){q.opts=pickWordOpts(it);q.answer=it.word}
  if(type==='s'){q.answer=it.word}
  return q;
}
function assignTypes(items){
  var n=items.length,nb=Math.round(n*.2),nd=Math.round(n*.2),ns=Math.round(n*.3),nm=n-nb-nd-ns;
  var withS=shuffle(items.filter(function(it){return findInSent(it.v,it.d,it.word)})),
      rest=shuffle(items.filter(function(it){return !findInSent(it.v,it.d,it.word)}));
  var b=withS.slice(0,nb),left=shuffle(withS.slice(nb).concat(rest)),qs=[];
  b.forEach(function(it){qs.push(makeQ(it,'b'))});
  var need=[['s',ns],['d',nd+(nb-b.length)],['m',nm]],p=0;
  need.forEach(function(t){for(var k=0;k<t[1]&&p<left.length;k++)qs.push(makeQ(left[p++],t[0]))});
  while(p<left.length)qs.push(makeQ(left[p++],'m'));
  return shuffle(qs);
}
function takeRandom(arr,n,used){var out=[];shuffle(arr).forEach(function(x){if(out.length<n&&!used[x.key]){used[x.key]=1;out.push(x)}});return out}
function buildReview(v,d){
  var used={},total=20,items=[];
  var cur=takeRandom(dayWords(v,d),12,used);items=items.concat(cur);
  if(d-3>=1)items=items.concat(takeRandom(dayWords(v,d-3),3,used));
  if(d-7>=1)items=items.concat(takeRandom(dayWords(v,d-7),3,used));
  var wr=Object.keys(U().wrong).filter(function(k){return +k.split('-')[0]===v&&+k.split('-')[1]<=d}).map(function(k){var a=k.split('-');return W(+a[0],+a[1],+a[2])});
  items=items.concat(takeRandom(wr,2,used));
  var back=[];for(var x=d;x>=1;x--)back=back.concat(dayWords(v,x));
  if(items.length<total)items=items.concat(takeRandom(back,total-items.length,used));
  return items;
}

function needFor(l){return 100+(l-1)*50} /* XP to go from level l to l+1 */
function levelOf(xp){var l=1,rest=xp;while(rest>=needFor(l)&&l<30){rest-=needFor(l);l++}return{lv:l,into:rest,need:l>=30?0:needFor(l),tier:TIERS[Math.min(9,Math.floor((l-1)/3))]}}
function xpOf(r){if(r.xp!=null&&r.xp!=='')return +r.xp;if(r.mode==='retry')return r.score*5;return r.score*10+(r.pass?50:0)+(r.pct===100&&r.total>=10?50:0)}

function dateKey(t){return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())}
function streakOf(rs){
  var days={};rs.forEach(function(r){days[r.when.slice(0,10)]=1});
  var t=new Date(),n=0;if(!days[dateKey(t)])t=new Date(Date.now()-864e5);
  while(days[dateKey(t)]){n++;t=new Date(t.getTime()-864e5)}return{n:n,today:!!days[dateKey(new Date())],best:bestStreak(Object.keys(days).sort())};
}
function bestStreak(ds){var b=0,c=0,prev=null;ds.forEach(function(d){var t=new Date(d+'T00:00:00').getTime();c=(prev!==null&&Math.round((t-prev)/864e5)===1)?c+1:1;prev=t;if(c>b)b=c});return b}
function statsOf(rs){
  var s={xp:0,n:rs.length,pass:0,perfect:0,maxCombo:0,review:0,rangePass:0,days:{},vols:{}};
  rs.forEach(function(r){s.xp+=xpOf(r);if(r.pass)s.pass++;if(r.pct===100&&r.total>=10)s.perfect++;s.maxCombo=Math.max(s.maxCombo,+r.combo||0);
    if(r.mode==='review')s.review++;if(r.mode==='range'&&r.pass)s.rangePass++;
    if(r.mode==='day'&&r.pass){s.days[r.v+'-'+r.d]=1;(s.vols[r.v]=s.vols[r.v]||{})[r.d]=1}});
  s.dayPass=Object.keys(s.days).length;s.volDone=Object.keys(s.vols).filter(function(v){return Object.keys(s.vols[v]).length>=32}).length;
  s.streak=streakOf(rs);s.level=levelOf(s.xp);return s;
}

/* ---------- quiz ---------- */
function startQuiz(mode,v,dLabel,items){
  if(!items.length){return}
  S.quiz={mode:mode,v:v,d:dLabel,qs:assignTypes(items),idx:0,answers:[],back:S.view==='wrong'?'wrong':(mode==='range'?'vol':'day')};
  go('quiz');
}
function checkTyped(q,val){
  var a=norm(val);if(!a)return false;
  var t=norm(q.answer);if(a===t)return true;
  var alts=q.answer.split(/\s*\/\s*/);for(var i=0;i<alts.length;i++)if(norm(alts[i])===a)return true;
  return false;
}
function vQuiz(){
  var Q=S.quiz,q=Q.qs[Q.idx],it=q.it,n=Q.qs.length;
  setCrumb(MODE_NAME[Q.mode]+' · '+(Q.idx+1)+'/'+n);
  var h='<div class="prog"><i style="width:'+(Q.idx/n*100)+'%"></i></div><div class="panel"><div class="qhead"><span class="qtype">'+TYPE_NAME[q.type]+'</span><span class="muted">'+(Q.idx+1)+' / '+n+'</span></div>';
  if(q.type==='m'){h+='<div class="prompt en">'+esc(it.word)+'</div><span class="muted">'+esc(it.cls)+' · 알맞은 뜻을 고르세요</span>'}
  if(q.type==='d'){h+='<div class="prompt">'+esc(it.def)+'</div><span class="muted">이 영영풀이에 맞는 단어를 고르세요</span>'}
  if(q.type==='s'){h+='<div class="prompt">'+esc(it.mean)+'</div><span class="hint">'+esc(it.cls)+' · '+hintOf(q.answer)+'</span>'}
  if(q.type==='b'){var f=q.sent;h+='<div class="prompt sent">'+esc(f.s.slice(0,f.start))+'<span class="blank">'+(Q.locked?esc(f.ans):'&nbsp;')+'</span>'+esc(f.s.slice(f.end))+'</div><span class="hint">뜻: '+esc(shortMean(it.mean))+' · '+hintOf(q.answer)+' · 문장에 맞는 형태로 쓰세요</span>'}
  if(q.opts){h+='<div class="opts">'+q.opts.map(function(o,i){return '<button class="opt" type="button" data-o="'+i+'">'+'①②③④'.charAt(i)+' '+esc(o)+'</button>'}).join('')+'</div>'}
  else{h+='<form id="tf" class="row" autocomplete="off"><input id="ta" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" style="flex:1" placeholder="영어로 쓰세요"><button class="btn" type="submit">확인</button></form>'}
  h+='<div id="fb"></div></div><div class="row" style="justify-content:space-between"><button class="btn ghost small" type="button" id="qQuit">그만하기</button><span class="muted">맞은 개수 '+Q.answers.filter(function(a){return a.ok}).length+((Q.combo||0)>=2?' · <span class="combo'+(Q.combo>=10?' hot':'')+'">'+Q.combo+' COMBO</span>':'')+'</span></div>';
  app.innerHTML=h;Q.locked=false;
  document.getElementById('qQuit').onclick=function(){S.view=Q.back;render()};
  if(q.opts){app.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){answer(q.opts[+b.dataset.o],b)}})}
  else{var ta=document.getElementById('ta');ta.focus();document.getElementById('tf').onsubmit=function(e){e.preventDefault();if(Q.locked){next();return}if(!ta.value.trim())return;answer(ta.value)}}
}
function hintOf(ans){return '첫 글자 '+esc(ans.charAt(0))+' · '+ans.replace(/[^A-Za-z]/g,'').length+'글자'}
function answer(val,btn){
  var Q=S.quiz,q=Q.qs[Q.idx];if(Q.locked)return;Q.locked=true;
  var ok=q.opts?(val===q.answer):checkTyped(q,val);
  Q.answers.push({q:q,given:val,ok:ok});
  var gainNow=0;if(ok){Q.combo=(Q.combo||0)+1;Q.maxCombo=Math.max(Q.maxCombo||0,Q.combo);
    var cb=Q.mode==='retry'?0:(Q.combo>=10?6:Q.combo>=6?4:Q.combo>=3?2:0);Q.bonus=(Q.bonus||0)+cb;gainNow=(Q.mode==='retry'?5:10)+cb}else Q.combo=0;
  if(q.opts){app.querySelectorAll('.opt').forEach(function(b){b.disabled=true;var o=q.opts[+b.dataset.o];if(o===q.answer)b.classList.add('right');else if(b===btn)b.classList.add('wrong')})}
  else{document.getElementById('ta').readOnly=true;var bl=app.querySelector('.blank');if(bl)bl.textContent=q.answer}
  var fb=document.getElementById('fb');
  fb.innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'정답!'+(Q.combo>=3?' <span class="combo'+(Q.combo>=10?' hot':'')+'">'+Q.combo+' COMBO</span>':''):'오답 · 정답: '+esc(q.answer))+'</div>'+(ok?'':'<div class="row" style="margin-top:10px"><button class="btn" type="button" id="qNext">다음 문제</button>'+spkBtn(q.it.word)+'</div>');
  if(ok){floatXP('+'+gainNow+' XP');setTimeout(next,650)}else{var nb=document.getElementById('qNext');nb.onclick=next;if(q.opts)nb.focus()}
}
function next(){var Q=S.quiz;if(Q.adv===Q.idx)return;Q.adv=Q.idx;Q.idx++;if(Q.idx>=Q.qs.length)finish();else vQuiz()}
function finish(){
  var Q=S.quiz,score=Q.answers.filter(function(a){return a.ok}).length,total=Q.qs.length,pct=Math.round(score/total*100);
  var pass=Q.mode==='wrong'?null:pct>=PASS[Q.mode];
  Q.answers.forEach(function(a){var k=a.q.it.key,w=U().wrong[k];
    if(a.ok){if(w){w.streak=(w.streak||0)+1;if(w.streak>=2)delete U().wrong[k]}}
    else{w=w||{n:0,streak:0};w.n++;w.streak=0;U().wrong[k]=w}});
  var before=statsOf(myResults());
  var now=new Date(),r={name:who().name,cls:who().cls,v:Q.v,d:Q.d,mode:Q.mode,score:score,total:total,when:stamp(now),pct:pct,pass:pass};
  r.code=certCode(r);
  var g={base:Q.mode==='retry'?score*5:score*10,combo:Q.mode==='retry'?0:(Q.bonus||0),pass:pass?50:0,perfect:(Q.mode!=='retry'&&pct===100&&total>=10)?50:0};
  r.xp=g.base+g.combo+g.pass+g.perfect;r.combo=Q.maxCombo||0;
  if(Q.mode==='day'){var key=Q.v+'-'+Q.d,pr=U().prog[key]||{best:0,pass:false,tries:0};pr.tries++;pr.best=Math.max(pr.best,pct);if(pass)pr.pass=true;U().prog[key]=pr}
  store.hist.push(r);persist();
  if(API_URL){var o={};for(var k in r)o[k]=r[k];o.book=vol(r.v).n;o.dayLabel=dayLabel(r.d);o.modeName=MODE_NAME[r.mode];
    o.wrongWords=Q.answers.filter(function(a){return !a.ok}).map(function(a){return a.q.it.word});store.outbox.push(o);saveOutbox();
    S.sendState='sending';flush(function(ok){S.sendState=ok?'sent':'wait';var el=document.getElementById('sendSt');if(el)el.innerHTML=sendMsg()})}
  var after=statsOf(myResults()),eb={};earned(before).forEach(function(id){eb[id]=1});
  S.result={r:r,answers:Q.answers,quiz:Q,gain:g,lvUp:after.level.lv>before.level.lv?after.level:null,newBadges:BADGES.filter(function(b){return b[4](after)&&!eb[b[0]]}),stats:after};go('result');
}

    var r={name:g('t_name'),v:+g('t_v'),d:g('t_m')==='wrong'?'오답':dv,mode:g('t_m'),score:+g('t_s'),total:+g('t_t'),when:g('t_w')};
    var ok=certCode(r)===g('t_c').toUpperCase().replace(/\s/g,'');
    document.getElementById('t_out').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'코드가 맞아요. 결과가 그대로예요.':'코드가 맞지 않아요. 입력 내용을 다시 확인하세요.')+'</div>';
  };
}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-say]');if(t){e.stopPropagation();speak(t.dataset.say);return}
  t=e.target.closest('[data-vol]');if(t){go('vol',{v:+t.dataset.vol});return}
  t=e.target.closest('[data-day]');if(t){go('day',{d:+t.dataset.day,tab:'list',ci:0,flip:false});return}
  t=e.target.closest('[data-tab]');if(t){S.tab=t.dataset.tab;S.flip=false;render();return}
});
document.addEventListener('keydown',function(e){
  if(S.view!=='quiz'||!S.quiz)return;var q=S.quiz.qs[S.quiz.idx];
  if(q.opts&&!S.quiz.locked&&/^[1-4]$/.test(e.key)){var b=app.querySelector('[data-o="'+(+e.key-1)+'"]');if(b)b.click()}
  else if(S.quiz.locked&&e.key==='Enter'&&q.opts){var nb=document.getElementById('qNext');if(nb&&document.activeElement!==nb){e.preventDefault();nb.click()}}
});
document.getElementById('logo').onclick=function(){go('home')};
document.getElementById('btnWrong').onclick=function(){go('wrong')};
document.getElementById('lnkHist').onclick=function(){go('hist')};
document.getElementById('lnkTeacher').onclick=function(){go('teacher')};

function boot(d){DATA=d;render();if(API_URL){if(store.mode==='academy')loadRoster(function(){if(S.view==='home')render()});flush();setInterval(flush,60000)}}
if(window.VOCA_DATA)boot(window.VOCA_DATA);
else fetch('data.json').then(function(r){return r.json()}).then(boot).catch(function(){app.innerHTML='<div class="panel"><p>단어 데이터를 불러오지 못했어요. 페이지를 새로 고쳐 주세요.</p></div>'});
})();
</script>
